<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证码</title>
    <style>
        /* 全局样式重置 */
        body, table, td, div, p, a, span {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px 0;
        }

        /* 容器样式 */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667eea;
        }

        .logo-text {
            display: inline-block;
            vertical-align: middle;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* 主体内容 */
        .content {
            padding: 40px 30px;
        }

        .greeting {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .message {
            font-size: 16px;
            color: #555555;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 验证码容器 */
        .captcha-container {
            background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
            border: 2px dashed #667eea;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .captcha-label {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .captcha-code {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            margin: 10px 0;
        }

        .captcha-warning {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 15px;
            font-weight: 500;
        }

        /* 时间提醒 */
        .time-info {
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 0 8px 8px 0;
        }

        .time-info strong {
            color: #e65100;
        }

        /* 安全提醒 */
        .security-note {
            background-color: #e8f5e8;
            border-left: 4px solid #4caf50;
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 0 8px 8px 0;
        }

        .security-note strong {
            color: #2e7d32;
        }

        /* 按钮样式 */
        .action-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            margin: 20px 0;
            transition: transform 0.3s ease;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        /* 底部样式 */
        .footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 25px 30px;
            text-align: center;
            font-size: 14px;
        }

        .footer-links {
            margin-top: 15px;
        }

        .footer-links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
            font-size: 13px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* 响应式设计 */
        @media screen and (max-width: 600px) {
            .email-container {
                margin: 10px;
                border-radius: 8px;
            }

            .content {
                padding: 25px 20px;
            }

            .captcha-code {
                font-size: 28px;
                letter-spacing: 5px;
                padding: 12px 20px;
            }

            .header {
                padding: 20px 15px;
            }

            .logo {
                font-size: 24px;
            }

            .logo-icon {
                width: 30px;
                height: 30px;
            }
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 25px 0;
        }

        /* Logo 图片样式 */
        .logo-img {
            width: 42px;
            height: 42px;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
